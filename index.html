<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LakshyaKosh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Site fonts block rendering; the showcase fonts (Fonts and Styles tabs) load without blocking. -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Archivo+Black&family=Cormorant+Garamond:wght@400..700&family=DM+Sans:wght@400..700&family=DM+Serif+Display&family=Fira+Code:wght@400..700&family=Fraunces:opsz,wght@9..144,400..800&family=IBM+Plex+Sans:wght@400..700&family=Inter:wght@400..700&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400..700&family=Manrope:wght@400..700&family=Merriweather:wght@400..700&family=Nunito:wght@500..900&family=Orbitron:wght@500..900&family=Oswald:wght@400..700&family=Outfit:wght@400..700&family=Playfair+Display:wght@400..700&family=Plus+Jakarta+Sans:wght@400..700&family=Poppins:wght@400..700&family=Press+Start+2P&family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..700&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400..700&family=Sora:wght@400..700&family=Syne:wght@500..800&family=Unbounded:wght@400..700&family=Urbanist:wght@400..700&family=VT323&family=Work+Sans:wght@400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Archivo+Black&family=Cormorant+Garamond:wght@400..700&family=DM+Sans:wght@400..700&family=DM+Serif+Display&family=Fira+Code:wght@400..700&family=Fraunces:opsz,wght@9..144,400..800&family=IBM+Plex+Sans:wght@400..700&family=Inter:wght@400..700&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400..700&family=Manrope:wght@400..700&family=Merriweather:wght@400..700&family=Nunito:wght@500..900&family=Orbitron:wght@500..900&family=Oswald:wght@400..700&family=Outfit:wght@400..700&family=Playfair+Display:wght@400..700&family=Plus+Jakarta+Sans:wght@400..700&family=Poppins:wght@400..700&family=Press+Start+2P&family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..700&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400..700&family=Sora:wght@400..700&family=Syne:wght@500..800&family=Unbounded:wght@400..700&family=Urbanist:wght@400..700&family=VT323&family=Work+Sans:wght@400..700&display=swap" rel="stylesheet" /></noscript>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..700&family=Hanken+Grotesk:wght@400..700&family=Instrument+Serif&family=Lexend:wght@400..700&family=Newsreader:opsz,wght@6..72,400..700&family=Onest:wght@400..700&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <script>
    // Apply the saved theme before first paint, so the loader and the page never flash the wrong colours.
    try {
      var t = localStorage.getItem('kosh-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.dataset.theme = t
    } catch (e) { /* storage blocked: stay on the light default */ }
  </script>
  <!-- Opening loader. Inlined so it paints before any script or stylesheet has downloaded. -->
  <style>
    #kosh-loader { --kl-bg: #f2f4f9; --kl-ink: #0e1330; --kl-muted: #5b6285; --kl-line: #d9deeb; --kl-brand: #3b3bf5; --kl-spark: #ffb020;
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: var(--kl-ink); font-family: "Instrument Sans", system-ui, sans-serif; }
    :root[data-theme="dark"] #kosh-loader { --kl-bg: #0a0d1f; --kl-ink: #eceffd; --kl-muted: #98a0c7; --kl-line: #262d58; --kl-brand: #7c7cff; }
    html.kosh-loading { overflow: hidden; }
    /* Two halves of the backdrop: they part like doors when the app is ready. */
    .kl-door { position: absolute; left: 0; right: 0; height: 50.2%; background: var(--kl-bg); transition: transform .85s cubic-bezier(.76, 0, .24, 1) .32s; }
    .kl-door::after { content: ''; position: absolute; inset: 0; opacity: .5;
      background-image: radial-gradient(var(--kl-line) 1px, transparent 1.4px); background-size: 24px 24px; }
    .kl-door-top { top: 0; }
    .kl-door-top::after { mask-image: radial-gradient(70% 90% at 50% 100%, #000, transparent 75%); }
    .kl-door-bottom { bottom: 0; }
    .kl-door-bottom::after { mask-image: radial-gradient(70% 90% at 50% 0%, #000, transparent 75%); }
    .kl-seam { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; transform: scaleX(0); opacity: 0;
      background: linear-gradient(90deg, transparent, var(--kl-brand) 30%, var(--kl-spark) 70%, transparent); box-shadow: 0 0 24px var(--kl-brand);
      transition: transform .4s cubic-bezier(.2, .7, .2, 1), opacity .25s; }
    .kl-glow { position: absolute; width: 44vmax; height: 44vmax; border-radius: 50%; filter: blur(70px); opacity: .22; animation: kl-drift 7s ease-in-out infinite alternate; }
    .kl-glow-a { background: var(--kl-brand); left: 50%; top: 50%; margin: -30vmax 0 0 -34vmax; }
    .kl-glow-b { background: var(--kl-spark); left: 50%; top: 50%; margin: -12vmax 0 0 -6vmax; opacity: .13; animation-delay: -3s; }
    .kl-stage { position: relative; display: grid; justify-items: center; width: min(340px, 82vw); transition: opacity .4s ease, transform .5s cubic-bezier(.2, .7, .2, 1), filter .4s; }

    /* The vault: a glass cube turning in 3D around a glowing core, with two orbit rings. */
    .kl-vault { position: relative; width: 132px; height: 132px; display: grid; place-items: center; perspective: 620px; }
    .kl-cube { position: relative; width: 60px; height: 60px; transform-style: preserve-3d; animation: kl-turn 4.2s cubic-bezier(.65, 0, .35, 1) infinite; }
    .kl-cube i { position: absolute; inset: 0; border-radius: 12px; border: 1.5px solid var(--kl-brand);
      background: color-mix(in srgb, var(--kl-brand) 9%, transparent); box-shadow: inset 0 0 20px color-mix(in srgb, var(--kl-brand) 30%, transparent); }
    .kl-cube i:nth-child(1) { transform: translateZ(30px); }
    .kl-cube i:nth-child(2) { transform: rotateY(180deg) translateZ(30px); }
    .kl-cube i:nth-child(3) { transform: rotateY(90deg) translateZ(30px); }
    .kl-cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(30px); }
    .kl-cube i:nth-child(5) { transform: rotateX(90deg) translateZ(30px); }
    .kl-cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(30px); }
    .kl-core { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px; border-radius: 50%; background: var(--kl-spark);
      box-shadow: 0 0 22px 6px color-mix(in srgb, var(--kl-spark) 70%, transparent); animation: kl-beat 1.4s ease-in-out infinite; }
    .kl-ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--kl-brand); border-right-color: color-mix(in srgb, var(--kl-brand) 35%, transparent);
      animation: kl-orbit 2.2s linear infinite; }
    .kl-ring-b { inset: 16px; border-top-color: var(--kl-spark); border-right-color: transparent; border-left-color: color-mix(in srgb, var(--kl-spark) 35%, transparent); animation-duration: 3.1s; animation-direction: reverse; }
    .kl-shadow { width: 76px; height: 10px; margin-top: 4px; border-radius: 50%; background: var(--kl-ink); opacity: .12; filter: blur(6px); animation: kl-breathe 4.2s ease-in-out infinite; }

    .kl-word { margin: 22px 0 0; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
    .kl-word span { display: inline-block; opacity: 0; transform: translateY(.7em) rotate(8deg); animation: kl-letter .6s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i) * 45ms + 120ms); }
    .kl-word b { font-weight: inherit; color: var(--kl-brand); }
    .kl-bar { position: relative; width: 100%; height: 3px; margin-top: 26px; border-radius: 99px; background: var(--kl-line); overflow: hidden; }
    .kl-bar i { position: absolute; inset: 0; transform: scaleX(0); transform-origin: 0 50%; border-radius: inherit; background: linear-gradient(90deg, var(--kl-brand), var(--kl-spark)); }
    .kl-bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 60%, #fff9 85%, transparent); animation: kl-sheen 1.3s linear infinite; }
    .kl-meta { display: flex; justify-content: space-between; width: 100%; margin: 10px 0 0; font-size: 12px; color: var(--kl-muted); }
    .kl-meta b { font: 500 12px "JetBrains Mono", ui-monospace, monospace; color: var(--kl-ink); font-variant-numeric: tabular-nums; }

    /* Leaving: content lifts away, a line of light draws across the seam, then the doors part. */
    #kosh-loader.kl-done { pointer-events: none; }
    .kl-done .kl-stage { opacity: 0; transform: scale(1.12); filter: blur(8px); }
    .kl-done .kl-glow { opacity: 0; transition: opacity .4s; }
    .kl-done .kl-seam { transform: scaleX(1); opacity: 1; transition-delay: .08s; }
    .kl-done .kl-door-top { transform: translateY(-101%); }
    .kl-done .kl-door-bottom { transform: translateY(101%); }
    .kl-gone .kl-seam { opacity: 0; transition: opacity .5s .3s; }

    @keyframes kl-turn { 0% { transform: rotateX(-26deg) rotateY(0deg); } 50% { transform: rotateX(-26deg) rotateY(180deg) scale(.9); } 100% { transform: rotateX(-26deg) rotateY(360deg); } }
    @keyframes kl-orbit { to { transform: rotate(360deg); } }
    @keyframes kl-beat { 50% { transform: scale(.72); opacity: .75; } }
    @keyframes kl-breathe { 50% { transform: scaleX(.82); opacity: .08; } }
    @keyframes kl-letter { to { opacity: 1; transform: none; } }
    @keyframes kl-sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    @keyframes kl-drift { to { transform: translate3d(6vmax, 4vmax, 0) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      .kl-cube, .kl-ring, .kl-core, .kl-shadow, .kl-glow, .kl-bar i::after { animation: none; }
      .kl-word span { animation: none; opacity: 1; transform: none; }
      .kl-door, .kl-seam, .kl-stage { transition: opacity .2s; }
      .kl-done .kl-door { transform: none; opacity: 0; }
      .kl-done .kl-seam { opacity: 0; }
    }
  </style>
  </head>
  <body>
    <div id="kosh-loader" role="status" aria-label="Loading LakshyaKosh">
      <div class="kl-door kl-door-top"></div>
      <div class="kl-door kl-door-bottom"></div>
      <span class="kl-glow kl-glow-a" aria-hidden="true"></span>
      <span class="kl-glow kl-glow-b" aria-hidden="true"></span>
      <span class="kl-seam" aria-hidden="true"></span>
      <div class="kl-stage">
        <div class="kl-vault" aria-hidden="true">
          <span class="kl-ring"></span>
          <span class="kl-ring kl-ring-b"></span>
          <div class="kl-cube"><i></i><i></i><i></i><i></i><i></i><i></i><span class="kl-core"></span></div>
        </div>
        <span class="kl-shadow" aria-hidden="true"></span>
        <p class="kl-word" aria-hidden="true"><span style="--i:0">L</span><span style="--i:1">a</span><span style="--i:2">k</span><span style="--i:3">s</span><span style="--i:4">h</span><span style="--i:5">y</span><span style="--i:6">a</span><b><span style="--i:7">K</span><span style="--i:8">o</span><span style="--i:9">s</span><span style="--i:10">h</span></b></p>
        <div class="kl-bar" aria-hidden="true"><i id="kl-fill"></i></div>
        <p class="kl-meta" aria-hidden="true"><span id="kl-status">Opening the treasury</span><b id="kl-pct">0%</b></p>
      </div>
    </div>
    <script>
      // Drives the loader. Progress eases toward 92% while the app downloads, then runs to 100% when
      // main.tsx calls window.__koshReady(). A short minimum keeps the exit from cutting the entrance off.
      (function () {
        var root = document.documentElement, el = document.getElementById('kosh-loader')
        var fill = document.getElementById('kl-fill'), pct = document.getElementById('kl-pct'), status = document.getElementById('kl-status')
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches
        var steps = ['Opening the treasury', 'Laying out components', 'Mixing palettes', 'Warming up shaders', 'Polishing pixels']
        var started = performance.now(), shown = 0, ready = false, finished = false
        root.classList.add('kosh-loading')
        function frame(now) {
          if (finished) return
          var target = ready ? 100 : 92 * (1 - Math.exp(-(now - started) / 900))
          shown += (target - shown) * (ready ? 0.2 : 0.08)
          if (ready && shown > 99.4) shown = 100
          fill.style.transform = 'scaleX(' + shown / 100 + ')'
          pct.textContent = Math.round(shown) + '%'
          status.textContent = steps[Math.min(steps.length - 1, Math.floor(shown / (100 / steps.length)))]
          if (shown === 100) return leave()
          requestAnimationFrame(frame)
        }
        function leave() {
          finished = true
          status.textContent = 'Ready'
          el.classList.add('kl-done')
          root.classList.remove('kosh-loading')
          setTimeout(function () { el.classList.add('kl-gone') }, 500)
          setTimeout(function () { el.remove() }, still ? 300 : 1500)
        }
        window.__koshReady = function () {
          var wait = still ? 0 : Math.max(0, 1200 - (performance.now() - started))
          setTimeout(function () { ready = true }, wait)
        }
        requestAnimationFrame(frame)
        // If the app never reports in (a script failed to load), do not trap the visitor behind the loader.
        setTimeout(function () { if (!ready) window.__koshReady() }, 12000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
